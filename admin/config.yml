# ============================================================
# Sveltia CMS — painel de edição do The Boreal Times
# Edita os mesmos arquivos markdown do repositório. Cada
# publicação vira um commit no Git, com autor e histórico.
# ============================================================

backend:
  name: github
  repo: app-algoritmo/theborealtimes
  branch: main
  site_domain: borealtimes.org

publish_mode: editorial_workflow      # rascunho → revisão → publicado
media_folder: "temas/boreal/estatico/img/upload"
public_folder: "/estatico/img/upload"
locale: pt

collections:
  - name: textos_pt
    label: "Textos · Português"
    label_singular: "Texto"
    folder: "conteudo/pt/materias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{secao}} · {{natureza}} · {{titulo}}"
    sortable_fields: [data, secao, titulo]
    fields:
      - { name: titulo, label: "Título", widget: string, pattern: ['^.{10,90}$', 'Entre 10 e 90 caracteres'] }
      - { name: resumo, label: "Resumo", widget: text, hint: "Uma ou duas frases, entre 120 e 180 caracteres. Serve de linha-fina e de descrição na busca." }
      - name: secao
        label: "Seção"
        widget: select
        options: ["Mitos e Deuses", "Sagas e Reis", "Era Viking", "Contos e Folclore"]
      - name: natureza
        label: "Natureza do texto"
        widget: select
        options: ["História documentada", "Saga ou fonte medieval", "Mito ou lenda", "Conto original"]
        hint: "Mito e lenda nunca são apresentados como fato. Conto original é ficção declarada."
      - { name: autor, label: "Editor responsável", widget: string, default: "Paulo Fernando de Barros", hint: "Nome próprio. O texto é narrado por IA; aqui vai quem responde pela publicação." }
      - { name: data, label: "Data de publicação", widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: imagem, label: "Imagem", widget: string, required: false, hint: "Caminho gerado por `publicar.py imagem`." }
      - { name: imagem_credito, label: "Crédito da imagem", widget: string, required: false, hint: "Ex.: Ilustração gerada por inteligência artificial (Qwen)." }
      - { name: imagem_alt, label: "Texto alternativo da imagem", widget: string, required: false, hint: "Obrigatório se houver imagem." }
      - { name: fontes, label: "Fontes", widget: list, required: false, hint: "Obras e estudos consultados. Obrigatório, exceto em conto original." }
      - { name: tags, label: "Etiquetas", widget: list, required: false, hint: "De duas a cinco, minúsculas, sem acento, com hífen." }
      - { name: body, label: "Texto", widget: markdown }

  - name: textos_en
    label: "Texts · English"
    label_singular: "Text"
    folder: "conteudo/en/materias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{secao}} · {{natureza}} · {{titulo}}"
    fields:
      - { name: titulo, label: "Headline", widget: string }
      - { name: resumo, label: "Standfirst", widget: text }
      - name: secao
        label: "Section"
        widget: select
        options: ["Myths & Gods", "Sagas & Kings", "Viking Age", "Tales & Folklore"]
      - name: natureza
        label: "Nature of the text"
        widget: select
        options: ["Documented history", "Saga or medieval source", "Myth or legend", "Original tale"]
      - { name: autor, label: "Responsible editor", widget: string, default: "Paulo Fernando de Barros" }
      - { name: data, label: "Date", widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: imagem, label: "Image", widget: string, required: false }
      - { name: imagem_credito, label: "Image credit", widget: string, required: false }
      - { name: imagem_alt, label: "Image alt text", widget: string, required: false }
      - { name: fontes, label: "Sources", widget: list, required: false }
      - { name: tags, label: "Tags", widget: list, required: false }
      - { name: body, label: "Body", widget: markdown }

  - name: paginas_pt
    label: "Páginas · Português"
    folder: "conteudo/pt/paginas"
    create: true
    fields:
      - { name: titulo, label: "Título", widget: string }
      - { name: resumo, label: "Resumo", widget: text, required: false }
      - { name: olho, label: "Olho", widget: string, required: false }
      - { name: template, label: "Modelo", widget: select, options: ["pagina", "sobre", "assinatura", "entrar"], default: "pagina" }
      - { name: atualizado, label: "Atualizado em", widget: string, required: false }
      - { name: body, label: "Texto", widget: markdown }

  - name: paginas_en
    label: "Pages · English"
    folder: "conteudo/en/paginas"
    create: true
    fields:
      - { name: titulo, label: "Title", widget: string }
      - { name: resumo, label: "Summary", widget: text, required: false }
      - { name: olho, label: "Eyebrow", widget: string, required: false }
      - { name: template, label: "Template", widget: select, options: ["pagina", "sobre", "assinatura", "entrar"], default: "pagina" }
      - { name: atualizado, label: "Updated", widget: string, required: false }
      - { name: body, label: "Body", widget: markdown }

  - name: configuracao
    label: "Configuração do jornal"
    files:
      - name: geral
        label: "Identidade, preços e medição"
        file: "boreal.yaml"
        fields:
          - name: site
            label: "Identidade"
            widget: object
            fields:
              - { name: nome, label: "Nome", widget: string }
              - { name: url, label: "Endereço", widget: string }
              - { name: editora, label: "Editora", widget: string }
              - { name: editor, label: "Editor responsável", widget: string }
          - name: medicao
            label: "Medição"
            widget: object
            fields:
              - { name: ga4, label: "Google Analytics (G-...)", widget: string, required: false }
              - { name: gtm, label: "Google Tag Manager", widget: string, required: false }
              - { name: verificacao_google, label: "Search Console", widget: string, required: false }
              - { name: verificacao_bing, label: "Bing", widget: string, required: false }
          - name: assinatura
            label: "Assinatura"
            widget: object
            fields:
              - name: aplicativos
                label: "Lojas de aplicativo"
                widget: object
                fields:
                  - { name: apple, label: "App Store", widget: string, required: false }
                  - { name: google, label: "Google Play", widget: string, required: false }
              - { name: paragrafos_abertos, label: "Parágrafos abertos antes do convite", widget: number, value_type: int, default: 3 }
