  curiosidades:
    - {texto: "Gjermundbu-hjelmen, den eneste nesten komplette vikinghjelmen som noen gang er funnet, er rund og har ingen horn.", url: "/no/2026/11/12/capacete-viking-chifres-gjermundbu/"}
    - {texto: "Omtrent 170 middelalderske sverd har navnet Ulfberht risset inn i bladet.", url: "/no/2026/11/13/espadas-ulfberht/"}
    - {texto: "I 1206 krysset to skiløpere fjellet med en prinsebaby for å redde ham.", url: "/no/2026/11/13/birkebeiner-haakon/"}
    - {texto: "Gudene bandt ulven Fenrir med et bånd laget av seks ting som ikke finnes.", url: "/no/2026/11/12/fenrir-lobo-corrente-gleipnir/"}
    - {texto: "Vikingene spilte hnefatafl, og de opprinnelige reglene til spillet gikk tapt.", url: "/no/2026/11/13/hnefatafl-tabuleiro/"}
    - {texto: "Jellingsteinen, fra omkring 965, har Danmarks navn skrevet med runer.", url: "/no/2026/11/13/jelling-harald-runas/"}
    - {texto: "I Hagia Sofia i Istanbul finnes runer risset av en nordmann, og en av dem ender med navnet Halfdan.", url: "/no/2026/11/13/guarda-varegue/"}
    - {texto: "En islandsk saga nevner en solstein som viser hvor solen er, selv bak skyene.", url: "/no/2026/11/13/pedra-solar/"}
    - {texto: "Frigg fikk alle ting til å sverge at de ikke ville skade Balder, men glemte en misteltein.", url: "/no/2026/11/13/baldr-visco/"}
