  curiosidades:
    - {texto: "O capacete de Gjermundbu, o único capacete viking quase completo já achado, é redondo e não tem chifres.", url: "/2026/11/12/capacete-viking-chifres-gjermundbu/"}
    - {texto: "Cerca de 170 espadas medievais trazem o nome Ulfberht gravado na lâmina.", url: "/2026/11/13/espadas-ulfberht/"}
    - {texto: "Em 1206, dois esquiadores atravessaram as montanhas com um príncipe-bebê para salvá-lo.", url: "/2026/11/13/birkebeiner-haakon/"}
    - {texto: "Os deuses prenderam o lobo Fenrir com uma fita feita de seis coisas que não existem.", url: "/2026/11/12/fenrir-lobo-corrente-gleipnir/"}
    - {texto: "Os vikings jogavam hnefatafl, e as regras originais do jogo se perderam.", url: "/2026/11/13/hnefatafl-tabuleiro/"}
    - {texto: "A pedra de Jelling, de cerca de 965, traz o nome da Dinamarca escrito em runas.", url: "/2026/11/13/jelling-harald-runas/"}
    - {texto: "Na Santa Sofia, em Istambul, há runas gravadas por um nórdico, e uma delas termina com o nome Halfdan.", url: "/2026/11/13/guarda-varegue/"}
    - {texto: "Uma saga islandesa fala de uma pedra do sol que mostra onde o sol está, mesmo atrás das nuvens.", url: "/2026/11/13/pedra-solar/"}
    - {texto: "Frigg fez todas as coisas jurarem não ferir Baldr, mas esqueceu um broto de visco.", url: "/2026/11/13/baldr-visco/"}
