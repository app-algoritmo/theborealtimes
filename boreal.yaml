  curiosidades:
    - {texto: "O capacete de Gjermundbu, o único capacete viking quase completo já achado, é redondo e não tem chifres.", url: "/pt/capacete-viking-chifres-gjermundbu/"}
    - {texto: "Cerca de 170 espadas medievais trazem o nome Ulfberht gravado na lâmina.", url: "/pt/espadas-ulfberht/"}
    - {texto: "Em 1206, dois esquiadores atravessaram as montanhas com um príncipe-bebê para salvá-lo.", url: "/pt/birkebeiner-haakon/"}
    - {texto: "Os deuses prenderam o lobo Fenrir com uma fita feita de seis coisas que não existem.", url: "/pt/fenrir-lobo-corrente-gleipnir/"}
    - {texto: "Os vikings jogavam hnefatafl, e as regras originais do jogo se perderam.", url: "/pt/hnefatafl-tabuleiro/"}
    - {texto: "A pedra de Jelling, de cerca de 965, traz o nome da Dinamarca escrito em runas.", url: "/pt/jelling-harald-runas/"}
    - {texto: "Na Santa Sofia, em Istambul, há runas gravadas por um nórdico, e uma delas termina com o nome Halfdan.", url: "/pt/guarda-varegue/"}
    - {texto: "Uma saga islandesa fala de uma pedra do sol que mostra onde o sol está, mesmo atrás das nuvens.", url: "/pt/pedra-solar/"}
    - {texto: "Frigg fez todas as coisas jurarem não ferir Baldr, mas esqueceu um broto de visco.", url: "/pt/baldr-visco/"}
