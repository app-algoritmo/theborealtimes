  curiosidades:
    - {texto: "The Gjermundbu helmet, the only nearly complete Viking helmet ever found, is round and has no horns.", url: "/did-the-vikings-wear-horned-helmets-what-the-gjermundbu/"}
    - {texto: "About 170 medieval swords bear the name Ulfberht engraved on the blade.", url: "/the-ulfberht-swords-the-name-engraved-on-viking-blades/"}
    - {texto: "In 1206, two skiers crossed the mountains with a baby prince to save him.", url: "/the-birkebeiner-and-the-ski-crossing-that-saved-the-future/"}
    - {texto: "The gods bound the wolf Fenrir with a ribbon made of six things that do not exist.", url: "/how-the-norse-gods-bound-the-wolf-fenrir-and-why-tyr-lost/"}
    - {texto: "The Vikings played hnefatafl, and the original rules of the game were lost.", url: "/hnefatafl-the-board-game-the-vikings-played-and-no-one/"}
    - {texto: "The Jelling stone, from around 965, has the name of Denmark written in runes.", url: "/the-jelling-stone-what-harald-bluetooth-had-carved-in-runes/"}
    - {texto: "In Hagia Sophia in Istanbul, there are runes carved by a Norseman, and one of them ends with the name Halfdan.", url: "/the-varangian-guard-the-vikings-who-protected-the-emperor/"}
    - {texto: "An Icelandic saga mentions a sunstone that shows where the sun is, even behind the clouds.", url: "/the-sunstone-the-crystal-that-may-have-helped-the-vikings/"}
    - {texto: "Frigg made all things swear not to harm Baldr, but forgot a sprout of mistletoe.", url: "/baldr-the-god-nothing-could-harm-and-the-sprig-of-mistletoe/"}
