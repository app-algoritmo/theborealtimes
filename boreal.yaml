  naturezas:
    - nome: História documentada
      fonte_obrigatoria: true
      descricao: >-
        Fatos, pessoas e lugares sustentados por arqueologia, documentos ou
        estudos de historiadores. Onde os especialistas divergem, o texto diz.
    - nome: Saga ou fonte medieval
      fonte_obrigatoria: true
      descricao: >-
        O que uma saga, uma crônica ou outro texto medieval conta, atribuído a
        ela. Muitas foram escritas séculos depois dos fatos, e o texto não as
        trata como registro exato.
    - nome: Mito ou lenda
      fonte_obrigatoria: true
      descricao: >-
        Histórias de deuses, seres e heróis da tradição nórdica, contadas a
        partir das fontes que as preservaram. Nunca apresentadas como fato.
    - nome: Conto original
      fonte_obrigatoria: false
      descricao: >-
        Ficção inventada para este site, inspirada no folclore e nos mitos do
        Norte. Não é tradição documentada.
  secoes:
    - nome: Mitos e Deuses
      slug: mitos
      lema: "Antes de haver reis, havia deuses."
      intro: "Nove mundos pendurados numa árvore, um deus que trocou um olho por sabedoria, um martelo que chama a tormenta. Aqui os mitos são contados como as fontes os guardaram, nas Eddas e em Snorri, sem fingir que sejam história, e sempre com a origem de cada pedaço."
      descricao: >-
        Odin, Thor, Freya, Loki e os nove mundos. A mitologia nórdica como
        chegou até nós, nas Eddas e em outras fontes.
    - nome: Sagas e Reis
      slug: sagas
      lema: "Ao pé do fogo, a memória vira canto."
      intro: "Reis, poetas e vingadores, contados por islandeses muito tempo depois dos fatos. As sagas são literatura e são fonte: às vezes confirmadas por runas e crônicas, às vezes puro talento de narrador. Cada texto separa o que a fonte diz do que a história sustenta."
      descricao: >-
        As sagas islandesas e os reis da Noruega, da Suécia e da Dinamarca,
        entre o que a fonte conta e o que a história confirma.
    - nome: Era Viking
      slug: vikings
      lema: "O mar era a estrada."
      intro: "Do fim do século VIII ao XI, barcos estreitos levaram comerciantes, colonos e guerreiros do Mar do Norte até Constantinopla e à América. Aqui a arqueologia fala primeiro: navios, espadas, moedas, runas e o que ainda não sabemos."
      descricao: >-
        Navegação, comércio, assentamentos e expedições, do fim do século VIII
        ao século XI, e o que a arqueologia mostra.
    - nome: Contos e Folclore
      slug: contos
      lema: "Quando a luz acaba cedo, os contos crescem."
      intro: "Trolls sob a ponte, nisser no celeiro, huldrefolk na floresta. O folclore escandinavo foi recolhido por gente como Asbjørnsen e Moe e aqui convive com histórias originais, sempre avisadas como inventadas."
      descricao: >-
        Trolls, huldras, nisser e contos de fadas escandinavos: o folclore e as
        histórias originais inspiradas nele.
  manifesto:
    titulo: Mitos, sagas e histórias do Norte, de todos os tempos
    chamada: >-
      Os deuses de Asgard, os reis das sagas, os navegantes que cruzaram o
      Atlântico, os contos de fadas escandinavos — verdadeiros, lendários ou
      inventados, com a natureza de cada um dita no alto da página.
    origem: >-
      <p>Cada texto declara a sua natureza: história documentada, saga ou fonte
      medieval, mito ou lenda, ou conto original. Quando há fonte, ela vem
      listada no fim.</p>
      <p>Os textos são narrados por inteligência artificial. O editor
      responsável é Paulo Fernando de Barros.</p>

