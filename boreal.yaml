  curiosidades:
    - {texto: "The Gjermundbu helmet, the only nearly complete Viking helmet ever found, is round and has no horns.", url: "/en/2026/11/12/capacete-viking-chifres-gjermundbu/"}
    - {texto: "About 170 medieval swords bear the name Ulfberht engraved on the blade.", url: "/en/2026/11/13/espadas-ulfberht/"}
    - {texto: "In 1206, two skiers crossed the mountains with a baby prince to save him.", url: "/en/2026/11/13/birkebeiner-haakon/"}
    - {texto: "The gods bound the wolf Fenrir with a ribbon made of six things that do not exist.", url: "/en/2026/11/12/fenrir-lobo-corrente-gleipnir/"}
    - {texto: "The Vikings played hnefatafl, and the original rules of the game were lost.", url: "/en/2026/11/13/hnefatafl-tabuleiro/"}
    - {texto: "The Jelling stone, from around 965, has the name of Denmark written in runes.", url: "/en/2026/11/13/jelling-harald-runas/"}
    - {texto: "In Hagia Sophia in Istanbul, there are runes carved by a Norseman, and one of them ends with the name Halfdan.", url: "/en/2026/11/13/guarda-varegue/"}
    - {texto: "An Icelandic saga mentions a sunstone that shows where the sun is, even behind the clouds.", url: "/en/2026/11/13/pedra-solar/"}
    - {texto: "Frigg made all things swear not to harm Baldr, but forgot a sprout of mistletoe.", url: "/en/2026/11/13/baldr-visco/"}
