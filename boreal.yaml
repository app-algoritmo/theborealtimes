      descricao: >-
        Facts, people and places supported by archaeology, documents or
        historians' work. Where specialists disagree, the text says so.
    - nome: Saga or medieval source
      fonte_obrigatoria: true
      descricao: >-
        What a saga, a chronicle or another medieval text tells, attributed to
        it. Many were written centuries after the events, and the text does not
        treat them as exact record.
    - nome: Myth or legend
      fonte_obrigatoria: true
      descricao: >-
        Stories of gods, beings and heroes of the Norse tradition, told from
        the sources that preserved them. Never presented as fact.
    - nome: Original tale
      fonte_obrigatoria: false
      descricao: >-
        Fiction invented for this site, inspired by the folklore and myths of
        the North. It is not documented tradition.
  secoes:
    - nome: Myths & Gods
      slug: myths
      descricao: >-
        Odin, Thor, Freya, Loki and the nine worlds. Norse mythology as it
        reached us, in the Eddas and other sources.
    - nome: Sagas & Kings
      slug: sagas
      descricao: >-
        The Icelandic sagas and the kings of Norway, Sweden and Denmark,
        between what the source tells and what history confirms.
    - nome: Viking Age
      slug: viking-age
      descricao: >-
        Seafaring, trade, settlement and expeditions, from the late eighth to
        the eleventh century, and what archaeology shows.
    - nome: Tales & Folklore
      slug: tales
      descricao: >-
        Trolls, huldrefolk, nisser and Scandinavian fairy tales: the folklore
        and the original stories inspired by it.
  manifesto:
    titulo: Myths, sagas and stories of the North, from every age
    chamada: >-
      The gods of Asgard, the kings of the sagas, the sailors who crossed the
      Atlantic, the Scandinavian fairy tales — true, legendary or invented,
      with the nature of each stated at the top of the page.
    origem: >-
      <p>Every text states its nature: documented history, saga or medieval
      source, myth or legend, or original tale. Where there is a source, it is
      listed at the end.</p>
      <p>The texts are narrated by artificial intelligence. The responsible
      editor is Paulo Fernando de Barros.</p>
