  chamada_topo: Historias y juegos escandinavos
  descricao: >-
    Boreal Saga Play es una plataforma en línea de historias y juegos de Escandinavia y del mundo nórdico, para todas las edades. Cientos de narraciones, entre mitos, sagas y temas de la Era Vikinga, cada una con su propio juego, en 4 reinos y 9 mundos. En noruego, inglés, portugués y español. Educativo: historias basadas en fuentes reales y juegos que ejercitan la memoria, el razonamiento y la atención.
