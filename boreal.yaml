      fonte_obrigatoria: true
      descricao: >-
        What a saga, a chronicle or another medieval text tells, attributed to
        it. Many were written centuries after the events, and the text does not
        treat them as exact record.
    - nome: Myth or legend
      fonte_obrigatoria: true
      descricao: >-
        Stories of gods, beings and heroes of the Norse tradition, told from
        the sources that preserved them. Never presented as fact.
    - nome: Original tale
      fonte_obrigatoria: false
      descricao: >-
        Fiction invented for this site, inspired by the folklore and myths of
        the North. It is not documented tradition.
  secoes:
    - nome: Myths & Gods
      slug: myths
      lema: "Before there were kings, there were gods."
      intro: "Nine worlds hanging from a tree, a god who traded an eye for wisdom, a hammer that calls the storm. Here the myths are told as the sources kept them, in the Eddas and in Snorri, never passed off as history, and always with the origin of each piece."
      descricao: >-
        Odin, Thor, Freya, Loki and the nine worlds. Norse mythology as it
        reached us, in the Eddas and other sources.
    - nome: Sagas & Kings
      slug: sagas
      lema: "By the fire, memory becomes song."
      intro: "Kings, poets and avengers, told by Icelanders long after the events. The sagas are literature and they are sources: sometimes confirmed by runestones and chronicles, sometimes pure storyteller's talent. Each text separates what the source says from what history supports."
      descricao: >-
        The Icelandic sagas and the kings of Norway, Sweden and Denmark,
        between what the source tells and what history confirms.
    - nome: Viking Age
      slug: viking-age
      lema: "The sea was the road."
      intro: "From the late eighth to the eleventh century, narrow ships carried traders, settlers and warriors from the North Sea to Constantinople and North America. Here archaeology speaks first: ships, swords, coins, runes and what we still do not know."
      descricao: >-
        Seafaring, trade, settlement and expeditions, from the late eighth to
        the eleventh century, and what archaeology shows.
    - nome: Tales & Folklore
      slug: tales
      lema: "When the light goes early, the tales grow."
      intro: "Trolls under the bridge, nisser in the barn, huldrefolk in the forest. Scandinavian folklore was gathered by people like Asbjørnsen and Moe, and here it sits beside original stories, always flagged as invented."
      descricao: >-
        Trolls, huldrefolk, nisser and Scandinavian fairy tales: the folklore
        and the original stories inspired by it.
  manifesto:
    titulo: Myths, sagas and stories of the North, from every age
    chamada: >-
      The gods of Asgard, the kings of the sagas, the sailors who crossed the
      Atlantic, the Scandinavian fairy tales — true, legendary or invented,
      with the nature of each stated at the top of the page.
    origem: >-
      <p>Every text states its nature: documented history, saga or medieval
      source, myth or legend, or original tale. Where there is a source, it is
      listed at the end.</p>
      <p>The texts are narrated by artificial intelligence. The responsible
      editor is Paulo Fernando de Barros.</p>

