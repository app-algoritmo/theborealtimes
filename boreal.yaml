        Defence, alliances, sanctions, borders and territory. From Norway to
        Russia.
  manifesto:
    titulo: Economy, Science, Technology and Geopolitics in Europe and the World
    chamada: >-
      What gets decided in Brussels, what gets laid on the Baltic seabed, what
      comes out of a laboratory in Grenoble — and what arrives from
      Washington, Beijing, the Gulf. From Norway to Russia, from the document
      to the ground.
    origem: >-
      <p>Every article carries the writer's name, the date reporting closed
      and the origin of the information: documents consulted, public records,
      published tenders, or sources with direct knowledge of the matter.</p>
      <p>Official communication from a government, an armed force or a company
      is always attributed to whoever issued it, never presented as verified
      fact.</p>
