  naturezas:
    - nome: Historia documentada
      fonte_obrigatoria: true
      descricao: >-
        Hechos, personas y lugares respaldados por la arqueología, por
        documentos o por el trabajo de los historiadores. Donde los
        especialistas discrepan, el texto lo dice.
    - nome: Saga o fuente medieval
      fonte_obrigatoria: true
      descricao: >-
        Lo que cuenta una saga, una crónica u otro texto medieval, siempre
        atribuido a él. Muchos se escribieron siglos después de los hechos, y
        el texto no los trata como registro exacto.
    - nome: Mito o leyenda
      fonte_obrigatoria: true
      descricao: >-
        Historias de dioses, seres y héroes de la tradición nórdica, contadas
        a partir de las fuentes que las conservaron. Nunca se presentan como
        hechos.
    - nome: Cuento original
      fonte_obrigatoria: false
      descricao: >-
        Ficción inventada para este sitio, inspirada en el folclore y los
        mitos del Norte. No es tradición documentada.
  secoes:
    - nome: Mitos y dioses
      slug: mitos
      lema: "Antes de los reyes, hubo dioses."
      intro: "Nueve mundos colgados de un árbol, un dios que cambió un ojo por sabiduría, un martillo que llama a la tormenta. Aquí los mitos se cuentan tal como los conservaron las fuentes, en las Eddas y en Snorri, sin hacerlos pasar nunca por historia y siempre con el origen de cada pieza."
      descricao: >-
        Odín, Thor, Freya, Loki y los nueve mundos. La mitología nórdica tal
        como ha llegado hasta nosotros, en las Eddas y otras fuentes.
    - nome: Sagas y reyes
      slug: sagas
      lema: "Junto al fuego, la memoria se hace canto."
      intro: "Reyes, poetas y vengadores, contados por los islandeses mucho después de los hechos. Las sagas son literatura y son fuentes: a veces confirmadas por piedras rúnicas y crónicas, a veces puro talento de narrador. Cada texto separa lo que dice la fuente de lo que respalda la historia."
      descricao: >-
        Las sagas islandesas y los reyes de Noruega, Suecia y Dinamarca, entre
        lo que cuenta la fuente y lo que confirma la historia.
    - nome: Era vikinga
      slug: era-vikinga
      lema: "El mar era el camino."
      intro: "Desde finales del siglo VIII hasta el XI, barcos estrechos llevaron a comerciantes, colonos y guerreros del mar del Norte a Constantinopla y a América del Norte. Aquí habla primero la arqueología: barcos, espadas, monedas, runas y lo que todavía no sabemos."
      descricao: >-
        Navegación, comercio, asentamientos y expediciones, desde finales del
        siglo VIII hasta el XI, y lo que muestra la arqueología.
    - nome: Cuentos y folclore
      slug: cuentos
      lema: "Cuando la luz se va pronto, los cuentos crecen."
      intro: "Trolls bajo el puente, nisser en el establo, huldrefolk en el bosque. El folclore escandinavo fue recopilado por autores como Asbjørnsen y Moe, y aquí convive con historias originales, siempre señaladas como inventadas."
      descricao: >-
        Trolls, huldrefolk, nisser y cuentos de hadas escandinavos: el
        folclore y las historias originales inspiradas en él.
  manifesto:
    titulo: Mitos, sagas e historias del Norte, de todas las épocas
    chamada: >-
      Los dioses de Asgard, los reyes de las sagas, los marinos que cruzaron
      el Atlántico, los cuentos de hadas escandinavos: verdaderos, legendarios
      o inventados, con la naturaleza de cada uno indicada al principio de la
      página.
    origem: >-
      <p>Cada texto indica su naturaleza: historia documentada, saga o fuente
      medieval, mito o leyenda, o cuento original. Cuando hay fuente, aparece
      al final.</p>
      <p>Los textos están narrados por inteligencia artificial. El editor
      responsable es Paulo Fernando de Barros.</p>
