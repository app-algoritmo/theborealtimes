  secoes:
    - nome: Economy
      slug: economy
      descricao: >-
        Public budgets, debt, funds, development banks, listed companies and
        state contracts, military spending included.
    - nome: Science
      slug: science
      descricao: >-
        Research and who funds it. Nuclear energy, materials, space, climate,
        public health, and the European programmes that pay for them.
    - nome: Technology
      slug: technology
      descricao: >-
        Data centres, artificial intelligence, semiconductors, subsea cable,
        the power grid, telecoms and cybersecurity.
    - nome: Geopolitics
      slug: geopolitics
