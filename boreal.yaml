    leitura: min de leitura
    informacao: Reportagem humana
    por: Por
    atualizado: Atualizado em
    loja_apple: Baixar na App Store
    loja_google: Baixar no Google Play
    lojas_pendente: Aplicativos em publicação nas lojas.
    idioma_sugestao: This newspaper is also published in English.
    idioma_sugestao_botao: Read in English
  secoes:
    - nome: Economia
      slug: economia
      descricao: >-
        Orçamento público, dívida, fundos, bancos de desenvolvimento, empresas
        listadas e contratos do Estado, inclusive o gasto militar.
    - nome: Ciência
      slug: ciencia
      descricao: >-
        Pesquisa e quem a financia. Energia nuclear, materiais, espaço, clima,
        saúde pública e os programas europeus que pagam a conta.
    - nome: Tecnologia
      slug: tecnologia
      descricao: >-
        Data center, inteligência artificial, semicondutor, cabo submarino,
        rede elétrica, telecomunicação e cibersegurança.
    - nome: Geopolítica
      slug: geopolitica
      descricao: >-
        Defesa, alianças, sanções, fronteiras e território. Da Noruega à
        Rússia.
  manifesto:
    titulo: Economia, Ciência, Tecnologia e Geopolítica na Europa e no Mundo
    chamada: >-
      O que se decide em Bruxelas, o que se assenta no fundo do Báltico, o que
      sai de um laboratório em Grenoble — e o que chega de Washington, de
      Pequim, do Golfo. Da Noruega à Rússia, do documento ao terreno.
    origem: >-
      <p>Toda matéria sai com nome do autor, data de encerramento da apuração
      e a origem da informação: documento consultado, registro público,
      licitação publicada ou fontes com conhecimento direto do assunto.</p>
      <p>Comunicação oficial de governo, de força armada ou de empresa é
      sempre atribuída a quem a emitiu, nunca apresentada como fato apurado.</p>

