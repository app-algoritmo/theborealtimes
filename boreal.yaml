      descricao: >-
        Facts, people and places supported by archaeology, documents or
        historians' work. Where specialists disagree, the text says so.
    - nome: Saga or medieval source
      fonte_obrigatoria: true
      descricao: >-
        What a saga, a chronicle or another medieval text tells, attributed to
