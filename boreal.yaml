# ============================================================
# BOREAL TIMES — configuração central
# Português é o idioma principal. Inglês é secundário, em /en/.
# ============================================================

site:
  nome: The Boreal Times
  url: https://borealtimes.org
  publicacao_de: Duna Press
  publicacao_de_url: https://dunapress.org
  casa_desde: 2017
  editora: DIGITAL SOLUTIONS - DE BARROS
  organizacao_nr: "996 041 468"
  editor: Paulo Fernando de Barros
  fundado: 2025
  local:
    cidade: Larvik
    regiao: "38"
    pais: "NO"
    latitude: "59.0544"
    longitude: "10.0268"
    endereco: "Holtebygdveien 23, 3282 Kvelde, Larvik, Noruega"
    # O relógio do jornal. A Cloudflare constrói em UTC; sem isto, a
    # reconstrução noturna viraria a data uma hora tarde demais.
    fuso: Europe/Oslo
  cobertura: Europa e mundo
  redes:
    facebook: https://www.facebook.com/borealtimes
    instagram: https://www.instagram.com/borealtimes
    threads: https://www.threads.com/@borealtimes
    youtube: https://www.youtube.com/@borealtimes
    x: https://x.com/borealtimes

# ------------------------------------------------------------
# Medição — consentimento negado por padrão; a CMP do AdSense atualiza
# ------------------------------------------------------------
medicao:
  ga4: "G-F8DGD8SR0E"
  verificacao_google: ""   # preencher depois do site no ar
  verificacao_bing: ""

# ------------------------------------------------------------
# Publicidade — a web é aberta e com anúncio; o aplicativo é sem
# ------------------------------------------------------------
publicidade:
  adsense: "ca-pub-7977428997189299"
  # A mensagem de privacidade (CMP certificada) é configurada no painel do
  # AdSense, em Privacidade e mensagens, e servida pelo próprio script.

assinatura:
  aplicativos:
    apple: ""      # https://apps.apple.com/app/...
    google: ""     # https://play.google.com/store/apps/details?id=...

# ------------------------------------------------------------
# Idiomas
# ------------------------------------------------------------
idiomas:
  - codigo: pt-BR
    curto: pt
    prefixo: ""
    rotulo: Português
    principal: true
  - codigo: en
    curto: en
    prefixo: /en
    rotulo: English
    principal: false

