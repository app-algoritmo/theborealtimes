# ============================================================
# THE BOREAL TIMES — configuração central
# Histórias do Norte: mitos, sagas, lendas, contos e história.
# Português é o idioma principal. Inglês e norueguês são secundários, em /en/ e /no/.
# ============================================================

site:
  nome: Boreal Saga Play
  url: https://borealsagaplay.com
  publicacao_de: Duna Press
  # Nome que aparece no cabeçalho (o nome oficial do site continua sendo "nome").
  marca: Boreal Saga Play
  publicacao_de_url: https://dunapress.org
  casa_desde: 2017
  editora: DIGITAL SOLUTIONS - DE BARROS
  organizacao_nr: "996 041 468"
  editor: Paulo Fernando de Barros
  fundado: 2025
  local:
    cidade: Larvik
    regiao: "38"
    pais: "NO"
    latitude: "59.0544"
    longitude: "10.0268"
    endereco: "Holtebygdveien 23, 3282 Kvelde, Larvik, Noruega"
    # O relógio do jornal. A Cloudflare constrói em UTC; sem isto, a
    # reconstrução noturna viraria a data uma hora tarde demais.
    fuso: Europe/Oslo
  cobertura: Escandinávia e mundo nórdico
  redes:
    # Só entram no rodapé as contas que existem (campo vazio é ignorado).
    facebook: https://www.facebook.com/borealsagaplay/
    instagram: https://www.instagram.com/borealsagaplay/
    threads: https://www.threads.com/@borealsagaplay
    youtube: https://www.youtube.com/@borealsagaplay
    tiktok: https://www.tiktok.com/@borealsagaplay
    twitter: ""

# ------------------------------------------------------------
# Medição — consentimento negado por padrão; a CMP do AdSense atualiza
# ------------------------------------------------------------
medicao:
  ga4: "G-F8DGD8SR0E"
  verificacao_google: ""   # preencher depois do site no ar
  verificacao_bing: ""

# ------------------------------------------------------------
# Publicidade — o site é aberto e gratuito, com anúncios
# ------------------------------------------------------------
publicidade:
  adsense: "ca-pub-7977428997189299"
  # A mensagem de privacidade (CMP certificada) é configurada no painel do
  # AdSense, em Privacidade e mensagens, e servida pelo próprio script.

assinatura:
  # Endereço do script PHP que grava as inscrições (pasta servidor/ do repositório,
  # enviada por FTP ao Domeneshop). Ver servidor/LEIA-ME.md.
  endpoint: "https://api.dsnorge.com/boreal/inscrever.php"

# ------------------------------------------------------------
# Idiomas
# ------------------------------------------------------------
idiomas:
  - codigo: nb
    curto: "no"
    prefixo: /no
    rotulo: Norsk
    principal: false
  - codigo: pt-BR
    curto: pt
    prefixo: ""
    rotulo: Português
    principal: true
  - codigo: en
    curto: en
    prefixo: /en
    rotulo: English
    principal: false

