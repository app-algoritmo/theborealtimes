  curiosidades:
    - {texto: "Gjermundbu-hjelmen, den eneste nesten komplette vikinghjelmen som noen gang er funnet, er rund og har ingen horn.", url: "/no/hadde-vikingene-hjelmer-med-horn-hva-gjermundbu-funnet-viser/"}
    - {texto: "Omtrent 170 middelalderske sverd har navnet Ulfberht risset inn i bladet.", url: "/no/ulfberht-sverdene-navnet-risset-inn-pa-vikingblader/"}
    - {texto: "I 1206 krysset to skiløpere fjellet med en prinsebaby for å redde ham.", url: "/no/birkebeinerne-og-skiferden-som-reddet-den-senere-kong-hakon/"}
    - {texto: "Gudene bandt ulven Fenrir med et bånd laget av seks ting som ikke finnes.", url: "/no/hvordan-de-norrone-gudene-bandt-ulven-fenrir-og-hvorfor-tyr/"}
    - {texto: "Vikingene spilte hnefatafl, og de opprinnelige reglene til spillet gikk tapt.", url: "/no/hnefatafl-brettspillet-vikingene-spilte-og-som-ingen-vet/"}
    - {texto: "Jellingsteinen, fra omkring 965, har Danmarks navn skrevet med runer.", url: "/no/jellingsteinen-det-harald-blatann-lot-risse-inn-i-runer/"}
    - {texto: "I Hagia Sofia i Istanbul finnes runer risset av en nordmann, og en av dem ender med navnet Halfdan.", url: "/no/vaeringgarden-vikingene-som-beskyttet-keiseren/"}
    - {texto: "En islandsk saga nevner en solstein som viser hvor solen er, selv bak skyene.", url: "/no/solsteinen-krystallen-som-kanskje-hjalp-vikingene-a-finne/"}
    - {texto: "Frigg fikk alle ting til å sverge at de ikke ville skade Balder, men glemte en misteltein.", url: "/no/balder-guden-ingenting-kunne-skade-og-misteltein-skuddet/"}
