# ------------------------------------------------------------
medicao:
  ga4: "G-F8DGD8SR0E"
  verificacao_google: ""   # preencher depois do site no ar
  verificacao_bing: ""

# ------------------------------------------------------------
# Publicidade — a web é aberta e com anúncio; o aplicativo é sem
