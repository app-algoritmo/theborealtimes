  naturezas:
    - nome: Dokumentert historie
      fonte_obrigatoria: true
      descricao: >-
        Fakta, personer og steder som støttes av arkeologi, dokumenter eller
        historikeres arbeid. Der fagfolk er uenige, sier teksten fra om det.
    - nome: Saga eller middelalderkilde
      fonte_obrigatoria: true
      descricao: >-
        Det en saga, en krønike eller en annen middelaldertekst forteller,
        tilskrevet kilden. Mange ble skrevet århundrer etter hendelsene, og
        teksten behandler dem ikke som nøyaktige opptegnelser.
    - nome: Myte eller legende
      fonte_obrigatoria: true
      descricao: >-
        Fortellinger om guder, vesener og helter i den norrøne tradisjonen,
        gjenfortalt etter kildene som har bevart dem. Aldri fremstilt som fakta.
    - nome: Original fortelling
      fonte_obrigatoria: false
      descricao: >-
        Fiksjon diktet opp for dette nettstedet, inspirert av folketroen og
        mytene fra Norden. Det er ikke dokumentert tradisjon.
  secoes:
    - nome: Myter og guder
      slug: myter
      lema: "Før det fantes konger, fantes det guder."
      intro: "Ni verdener som henger i et tre, en gud som byttet bort et øye mot visdom, en hammer som kaller på stormen. Her fortelles mytene slik kildene har bevart dem, i Eddaene og hos Snorre, uten å utgi dem for historie, og alltid med opphavet til hver bit."
      descricao: >-
        Odin, Tor, Frøya, Loke og de ni verdenene. Norrøn mytologi slik den
        har nådd oss, i Eddaene og andre kilder.
    - nome: Sagaer og konger
      slug: sagaer
      lema: "Ved bålet blir minnet til sang."
      intro: "Konger, skalder og hevnere, fortalt av islendinger lenge etter hendelsene. Sagaene er litteratur, og de er kilder: noen ganger bekreftet av runesteiner og krøniker, andre ganger ren fortellerkunst. Hver tekst skiller mellom det kilden sier og det historien kan belegge."
      descricao: >-
        De islandske sagaene og kongene i Norge, Sverige og Danmark, mellom
        det kilden forteller og det historien bekrefter.
    - nome: Vikingtid
      slug: vikingtid
      lema: "Havet var veien."
      intro: "Fra slutten av 700-tallet til 1000-tallet førte smale skip kjøpmenn, nybyggere og krigere fra Nordsjøen til Konstantinopel og Nord-Amerika. Her får arkeologien ordet først: skip, sverd, mynter, runer og det vi fortsatt ikke vet."
      descricao: >-
        Sjøfart, handel, bosetting og tokt, fra slutten av 700-tallet til
        1000-tallet, og det arkeologien viser.
    - nome: Eventyr og folketro
      slug: eventyr
      lema: "Når lyset forsvinner tidlig, vokser eventyrene."
      intro: "Troll under brua, nisser i fjøset, huldrefolk i skogen. Den skandinaviske folketroen ble samlet av folk som Asbjørnsen og Moe, og her finner den plass ved siden av originale fortellinger, alltid merket som diktet."
      descricao: >-
        Troll, huldrefolk, nisser og skandinaviske eventyr: folketroen og de
        originale fortellingene den har inspirert.
  manifesto:
    titulo: Myter, sagaer og historier fra Norden, fra alle tider
    chamada: >-
      Asgards guder, sagaenes konger, sjøfarerne som krysset Atlanterhavet,
      de skandinaviske eventyrene — sanne, legendariske eller diktede, med
      tekstens art oppgitt øverst på siden.
    origem: >-
      <p>Hver tekst oppgir sin art: dokumentert historie, saga eller
      middelalderkilde, myte eller legende, eller original fortelling. Der det
      finnes en kilde, står den oppført til slutt.</p>
      <p>Tekstene er fortalt av kunstig intelligens. Ansvarlig redaktør er
      Paulo Fernando de Barros.</p>
